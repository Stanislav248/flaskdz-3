<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Trattoria{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Playfair+Display:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="{{ url_for('index') }}">Trattoria<small>est. 2024</small></a>
    <nav>
      <a href="{{ url_for('index') }}" class="{{ 'active' if request.endpoint == 'index' }}">Меню</a>
      <a href="{{ url_for('delivery') }}" class="{{ 'active' if request.endpoint == 'delivery' }}">
        Доставка <span class="badge" data-cart-count>0</span>
      </a>
    </nav>
  </header>

  <main>{% block content %}{% endblock %}</main>

  <footer class="site-footer">© 2024 Trattoria · Івано-Франківськ</footer>

  <script>
    window.MENU = {{ menu_by_id | default({}) | tojson }};
    window.CONFIG = { fee: {{ fee | default(60) }}, freeFrom: {{ free_from | default(500) }} };
  </script>
  <script src="{{ url_for('static', filename='script.js') }}"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
